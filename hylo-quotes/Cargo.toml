[package]
name = "hylo-quotes"
version.workspace = true
edition.workspace = true
description = "Quote computation and execution layer for Hylo protocol"
license.workspace = true
homepage.workspace = true
# Jupiter fork: the integration tests drive an RpcClient through hylo-clients,
# which this workspace does not build.
autotests = false

[features]
shadow = ["hylo-idl/shadow", "hylo-core/shadow"]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
anyhow.workspace = true
bincode.workspace = true
hylo-core = { workspace = true, features = ["offchain"] }
hylo-fix.workspace = true
hylo-idl.workspace = true
pyth-solana-receiver-sdk.workspace = true
serde.workspace = true
solana-account.workspace = true

[lints]
workspace = true
